version: '3.8'
services:
  demo:
    image: ghcr.io/open-feature/playground-app:v0.16.0@sha256:08d2c59795cb72b5c625653d2dfe731b5a1d86eeecf27459ebd72a8fd1d6a0b8 # x-release-please-version
    # build:
    #  dockerfile: ./packages/app/Dockerfile
    #  context: .
    ports:
      - '30000:30000'
    command:
      # The default provider
      - flagd
    depends_on:
      - flagd
      - jaeger
      - fib-service
    volumes:
      - ./config/flagd/flags.json:/opt/playground/config/flagd/flags.json
    environment:
      - FLAGD_HOST=flagd
      - OTEL_EXPORTER_JAEGER_AGENT_HOST=jaeger
      - OTEL_EXPORTER_JAEGER_AGENT_PORT=6832
      - GO_FEATURE_FLAG_URL=http://go-feature-flag:1031
      - GO_FEATURE_FLAG_WEB_URL=http://localhost:1031
      - FIB_SERVICE_URL=http://fib-service:30001
      - FLIPT_URL=http://flipt:8080
      - FLIPT_WEB_URL=http://localhost:8080
      - FIB_SERVICE_USER
      - FIB_SERVICE_PASS
      # Provider values come from the .env
      - NEW_WELCOME_MESSAGE
      - FIB_ALGO
      - HEX_COLOR
      # Feature Flag Vendor Keys come from the .env
      ## Server
      - HARNESS_KEY
      - SPLIT_KEY
      - LD_KEY
      - FLAGSMITH_ENV_KEY
      - CLOUDBEES_APP_KEY
      - CONFIGCAT_SDK_KEY
      ## Web
      - HARNESS_KEY_WEB
      - SPLIT_KEY_WEB
      - LD_KEY_WEB
      - FLAGSMITH_ENV_KEY_WEB
      - CLOUDBEES_APP_KEY_WEB
      - FLAGD_HOST_WEB
      - FLAGD_PORT_WEB
      - FLAGD_TLS_WEB      
      - CONFIGCAT_SDK_KEY_WEB

  fib-service:
    image: ghcr.io/open-feature/playground-fib-service:v0.16.0@sha256:3bff30ed4bbf32b0cdbe02d3985302f2d97d0bd3b096b528f58eeeb8f22cc3bf # x-release-please-version
    # build:
    #   dockerfile: ./packages/fibonacci-service/Dockerfile
    #   context: .
    expose:
      - '30001'
    environment:
      - FLAGD_HOST=flagd
      - OTEL_EXPORTER_JAEGER_AGENT_HOST=jaeger
      - OTEL_EXPORTER_JAEGER_AGENT_PORT=6832
      - OTEL_SERVICE_NAME=fibonacci-service
      - GO_FEATURE_FLAG_URL=http://go-feature-flag:1031
      - FLIPT_URL=http://flipt:8080
      - FIB_SERVICE_USER
      - FIB_SERVICE_PASS
      # Provider values come from the .env
      - NEW_WELCOME_MESSAGE
      - FIB_ALGO
      - HEX_COLOR
      # Feature Flag Vendor Keys come from the .env
      - HARNESS_KEY
      - SPLIT_KEY
      - LD_KEY
      - FLAGSMITH_ENV_KEY
      - CLOUDBEES_APP_KEY
      - CONFIGCAT_SDK_KEY

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    expose:
      - '6832/udp'
      - '4317'
    ports:
      - '16686:16686'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0@sha256:3ff721e65733a9c2d94e81cfb350e76f1cd218964d5608848e2e73293ea88114
    restart: always
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./config/otel/collector.yaml:/etc/otel-collector-config.yaml
    expose:
      - "1888"   # pprof extension
      - "8888"   # Prometheus metrics exposed by the collector
      - "8889"   # Prometheus exporter metrics
      - "4317"   # OTLP gRPC receiver
    depends_on:
      - jaeger
      - prometheus

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: always
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.3@sha256:a11ae82ec6e40e89edae4327392a1e4ffc03e211f1b724879bb35b2e4f271bb3
    command:
      - start
      - --cors-origin
      - '*'
      - --sources
      - '[{"uri":"etc/flagd/flags.json","provider":"file","selector":"etc/flagd/flags.json"}]'
      - --metrics-exporter
      - otel
      - --otel-collector-uri
      - otel-collector:4317
    volumes:
      - ./config/flagd/flags.json:/etc/flagd/flags.json
    ports:
      - '8013:8013'
      - '8016:8016'

  go-feature-flag:
    image: thomaspoignant/go-feature-flag:v1.40.0@sha256:655eae8236ab12fac411553df78a88875b186250ed97413cb635c319a5e04adc
    volumes:
      - ./config/go-feature-flag:/goff/
    ports:
      - "1031:1031"

  init_flipt:
    image: docker.flipt.io/flipt/flipt:v1.53.2
    command: ["./flipt", "import", "/var/opt/flipt/flipt.yml"]
    environment:
      FLIPT_LOG_LEVEL: debug
      FLIPT_META_TELEMETRY_ENABLED: false
      FLIPT_DB_URL: "/var/opt/flipt/flipt.db"
    volumes:
      - "./config/flipt/flipt.yml:/var/opt/flipt/flipt.yml"
      - "flipt:/var/opt/flipt"

  flipt:
    image: docker.flipt.io/flipt/flipt:v1.53.2
    command: ["./flipt", "--force-migrate"]
    environment:
      FLIPT_CORS_ENABLED: true
      FLIPT_TRACING_ENABLED: true
      FLIPT_TRACING_EXPORTER: otlp
      FLIPT_TRACING_OTLP_ENDPOINT: "otel-collector:4317"
      FLIPT_DB_URL: "/var/opt/flipt/flipt.db"
    volumes:
      - "./config/flipt/flipt.yml:/var/opt/flipt/flipt.yml"
      - "flipt:/var/opt/flipt"
    depends_on:
      - init_flipt
    ports:
      - '8080:8080'

volumes:
  flagd-flags:
  flipt:
